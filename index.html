<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almsoo7Labs</title>
<meta name="description" content="Almsoo7Labs is an independent game developer, home of Bronzeborn for Android.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: #0b1020; color: #e8e6df;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 560px; }
  h1 { margin: 0 0 4px; font-size: 2rem; letter-spacing: .04em; color: #f0c24a; }
  .tag { margin: 0 0 28px; color: #8b93a7; }
  h2 { margin: 0 0 8px; font-size: 1.15rem; }
  p { margin: 0 0 12px; color: #c2c7d4; }
  a { color: #f0c24a; text-decoration: none; border-bottom: 1px solid rgba(240,194,74,.35); }
  a:hover, a:focus-visible { border-bottom-color: #f0c24a; }
  .card { padding: 20px; border: 1px solid #232a40; border-radius: 10px; background: #111830; }
  footer { margin-top: 28px; font-size: .85rem; color: #6f778b; }
</style>
</head>
<body>
<main>
  <h1>Almsoo7Labs</h1>
  <p class="tag">Independent game development</p>

  <section class="card">
    <h2>Bronzeborn</h2>
    <p>A retro pixel-art action-platformer for Android. Four worlds, four bosses.</p>
    <p><a href="https://almsoo7labs.github.io/bronzeborn-privacy/">Privacy policy</a></p>
  </section>

  <footer>&copy; 2026 Almsoo7Labs</footer>
</main>
</body>
</html>
